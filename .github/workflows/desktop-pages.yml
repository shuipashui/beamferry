name: Desktop receiver Pages

on:
  push:
    branches: [main]
    paths:
      - "desktop-receiver/**"
      - "sender/**"
      - "shared/**"
      - "build-highspeed.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: desktop-receiver-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and test
        run: npm ci && npm test

      - name: Build web receivers and sender
        run: npm run build

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/desktop-receiver _site/sender/dist _site/vendor
          cp index.html app.js styles.css sw.js manifest.webmanifest protocol.js highspeed-protocol.js receiver-storage.js decoder-worker.js highspeed-decoder-worker.js _site/
          cp -r vendor/. _site/vendor/
          cp robots.txt sitemap.xml _site/
          cp sender/dist/beamferry-sender.html _site/sender/dist/beamferry-sender.html
          cp -r desktop-receiver/. _site/desktop-receiver/
          rm -f _site/desktop-receiver/serve.mjs _site/desktop-receiver/test.mjs _site/desktop-receiver/README.md

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
